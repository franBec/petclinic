spring:
  config:
    import: optional:file:.env
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/petclinic}
    username: ${JDBC_DATABASE_USERNAME:petclinic}
    password: ${JDBC_DATABASE_PASSWORD:petclinic}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    http-statuses:
      org.springframework.security.authorization.AuthorizationDeniedException: unauthorized
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
openapi:
  petclinic:
    base-path: ""
springdoc:
  pathsToMatch: /api/**, /authenticate
