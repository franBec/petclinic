<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout}">
    <head>
        <title>[[#{owner.list.headline}]]</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="flex flex-wrap mb-6">
                <h1 class="grow text-3xl md:text-4xl font-medium mb-2">[[#{owner.list.headline}]]</h1>
                <div>
                    <a th:href="@{/owners/add}" class="inline-block text-white bg-blue-600 hover:bg-blue-700 focus:ring-blue-300  focus:ring-4 rounded px-5 py-2">[[#{owner.list.createNew}]]</a>
                </div>
            </div>
            <div th:if="${!owners.empty || filter != null}" class="flex flex-wrap justify-between">
                <div th:replace="~{fragments/utils::searchFilter(object='owner')}" />
                <div th:replace="~{fragments/utils::sorting(object='owner', sortOptions=${ {'id,ASC', 'firstName,ASC', 'lastName,ASC'} })}" />
            </div>
            <div th:if="${owners.empty}">[[#{owner.list.empty}]]</div>
            <div th:if="${!owners.empty}" class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr>
                            <th scope="col" class="text-left p-2">[[#{owner.id.label}]]</th>
                            <th scope="col" class="text-left p-2">[[#{owner.createdAt.label}]]</th>
                            <th scope="col" class="text-left p-2">[[#{owner.updatedAt.label}]]</th>
                            <th scope="col" class="text-left p-2">[[#{owner.deletedAt.label}]]</th>
                            <th><!-- --></th>
                        </tr>
                    </thead>
                    <tbody class="border-t-2 border-black">
                        <tr th:each="owner : ${owners}" class="odd:bg-gray-100">
                            <td class="p-2">[[${owner.id}]]</td>
                            <td class="p-2">[[${owner.createdAt}]]</td>
                            <td class="p-2">[[${owner.updatedAt}]]</td>
                            <td class="p-2">[[${owner.deletedAt}]]</td>
                            <td class="p-2">
                                <div class="float-right whitespace-nowrap">
                                    <a th:href="@{/owners/edit/{id}(id=${owner.id})}" class="inline-block text-white bg-gray-500 hover:bg-gray-600 focus:ring-gray-200 focus:ring-3 rounded px-2.5 py-1.5 text-sm">[[#{owner.list.edit}]]</a>
                                    <form th:action="@{/owners/delete/{id}(id=${owner.id})}"
                                            th:hx-confirm="#{delete.confirm}" method="post" class="inline">
                                        <button type="submit" class="inline-block text-white bg-gray-500 hover:bg-gray-600 focus:ring-gray-200 focus:ring-3 rounded px-2.5 py-1.5 text-sm cursor-pointer">[[#{owner.list.delete}]]</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div th:replace="~{fragments/utils::pagination()}" />
        </div>
    </body>
</html>
